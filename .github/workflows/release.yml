name: Release bx-ui

on:
  push:
    tags:
      - "0.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            compiler_package: ""
            xray_asset: Xray-linux-64.zip
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            compiler_package: gcc-aarch64-linux-gnu
            xray_asset: Xray-linux-arm64-v8a.zip
          - arch: s390x
            cc: s390x-linux-gnu-gcc
            compiler_package: gcc-s390x-linux-gnu
            xray_asset: Xray-linux-s390x.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install cross compiler
        if: matrix.compiler_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y "${{ matrix.compiler_package }}"

      - name: Build panel
        env:
          CC: ${{ matrix.cc }}
          GOARCH: ${{ matrix.arch }}
        run: CGO_ENABLED=1 GOOS=linux go build -trimpath -ldflags="-s -w" -o bx-ui .

      - name: Package panel and Xray
        env:
          ARCH: ${{ matrix.arch }}
          XRAY_ASSET: ${{ matrix.xray_asset }}
          XRAY_VERSION: v26.3.27
        run: |
          mkdir -p "dist/x-ui/bin"
          install -m 755 bx-ui "dist/x-ui/x-ui"
          install -m 755 x-ui.sh "dist/x-ui/x-ui.sh"
          install -m 644 x-ui.service "dist/x-ui/x-ui.service"
          curl -fL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}" -o xray.zip
          unzip -j xray.zip xray geoip.dat geosite.dat -d "dist/x-ui/bin"
          mv "dist/x-ui/bin/xray" "dist/x-ui/bin/xray-linux-${ARCH}"
          tar -C dist -czf "x-ui-linux-${ARCH}.tar.gz" x-ui
          sha256sum "x-ui-linux-${ARCH}.tar.gz" > "x-ui-linux-${ARCH}.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bx-ui-${{ matrix.arch }}
          path: |
            x-ui-linux-${{ matrix.arch }}.tar.gz
            x-ui-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: bx-ui-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "bx-ui ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
