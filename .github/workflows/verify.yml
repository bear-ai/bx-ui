name: Verify bx-ui

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Tests and isolated Linux TUN runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go tests, race detector and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: JavaScript model tests
        run: node --test tests/xray_model_test.js

      - name: Download and verify the supported Xray core
        env:
          XRAY_VERSION: v26.3.27
          XRAY_ASSET: Xray-linux-64.zip
        run: |
          mkdir -p "${RUNNER_TEMP}/bx-ui-xray"
          cd "${RUNNER_TEMP}/bx-ui-xray"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}" -o xray.zip
          curl --proto '=https' --tlsv1.2 --retry 3 -fL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}.dgst" -o xray.zip.dgst
          expected="$(awk -F'= ' '/^SHA2-256=/{print $2}' xray.zip.dgst | tr -d '\r')"
          [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]]
          test "$(sha256sum xray.zip | awk '{print $1}')" = "$expected"
          unzip -j xray.zip xray -d .
          chmod 755 xray

      - name: Validate generated configurations with real Xray
        env:
          XRAY_TEST_BINARY: ${{ runner.temp }}/bx-ui-xray/xray
        run: |
          node --test tests/xray_config_integration_test.js
          go test ./xray -run TestInstalledXrayPreflight -v -count=1

      - name: Exercise real TUN with the production systemd sandbox
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
          test -d /run/systemd/system
          # PrivateTmp hides both /tmp and /var/tmp inside the service.
          runtime_dir="$(sudo mktemp -d /run/bx-ui-tun-ci.XXXXXX)"
          trap 'sudo rm -f -- "$runtime_dir/xray.test" "$runtime_dir/xray"; sudo rmdir -- "$runtime_dir"' EXIT
          sudo chmod 755 "$runtime_dir"
          go test -c -o "${RUNNER_TEMP}/bx-ui-xray/xray.test" ./xray
          sudo install -m 755 "${RUNNER_TEMP}/bx-ui-xray/xray.test" "$runtime_dir/xray.test"
          sudo install -m 755 "${RUNNER_TEMP}/bx-ui-xray/xray" "$runtime_dir/xray"
          sudo env BX_UI_TUN_RUNTIME=1 BX_UI_SOURCE_ROOT="$GITHUB_WORKSPACE" XRAY_TEST_BINARY="$runtime_dir/xray" \
            "$runtime_dir/xray.test" -test.run '^TestTUNRuntimeSystemd$' -test.v -test.timeout 2m
