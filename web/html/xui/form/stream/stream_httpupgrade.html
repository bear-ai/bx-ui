{{define "form/streamHTTPUpgrade"}}
<a-form layout="inline">
    <a-form-item label="Host"><a-input v-model.trim="inbound.stream.httpupgrade.host"></a-input></a-form-item>
    <a-form-item label="路径"><a-input v-model.trim="inbound.stream.httpupgrade.path"></a-input></a-form-item>
    <a-form-item label="acceptProxyProtocol"><a-switch v-model="inbound.stream.httpupgrade.acceptProxyProtocol"></a-switch></a-form-item>
    <a-form-item label="请求头">
        <a-button size="small" @click="inbound.stream.httpupgrade.addHeader()">+</a-button>
        <a-input-group v-for="(header, index) in inbound.stream.httpupgrade.headers" :key="index" compact>
            <a-input style="width: 45%" v-model.trim="header.name" placeholder="名称"></a-input>
            <a-input style="width: 45%" v-model.trim="header.value" placeholder="值"></a-input>
            <a-button style="width: 10%" @click="inbound.stream.httpupgrade.removeHeader(index)">-</a-button>
        </a-input-group>
    </a-form-item>
</a-form>
{{end}}
