{{define "form/http"}}
<a-form layout="inline">
    <a-form-item label="用户名">
        <a-input v-model.trim="inbound.settings.accounts[0].user"></a-input>
    </a-form-item>
    <a-form-item label="密码">
        <a-input v-model.trim="inbound.settings.accounts[0].pass"></a-input>
    </a-form-item>
    <a-form-item label="允许透明代理">
        <a-switch v-model="inbound.settings.allowTransparent"></a-switch>
    </a-form-item>
    <a-form-item label="用户等级">
        <a-input-number :min="0" v-model="inbound.settings.userLevel"></a-input-number>
    </a-form-item>
</a-form>
{{end}}
