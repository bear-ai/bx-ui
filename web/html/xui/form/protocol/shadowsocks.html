{{define "form/shadowsocks"}}
<a-form layout="inline">
    <a-form-item label="加密">
        <a-select v-model="inbound.settings.method" style="width: 260px;" @change="shadowsocksMethodChange">
            <a-select-option v-for="method in SSMethods" :key="method" :value="method">[[ method ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="密码">
        <a-input v-model.trim="inbound.settings.password">
            <a-icon slot="addonAfter" type="reload" @click="regenerateShadowsocksPassword"></a-icon>
        </a-input>
    </a-form-item>
    <a-form-item label="网络">
        <a-select v-model="inbound.settings.network" style="width: 100px;">
            <a-select-option value="tcp,udp">tcp+udp</a-select-option>
            <a-select-option value="tcp">tcp</a-select-option>
            <a-select-option value="udp">udp</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="IV 重放检查">
        <a-switch v-model="inbound.settings.ivCheck"></a-switch>
    </a-form-item>
</a-form>
{{end}}
